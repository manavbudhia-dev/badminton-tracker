name: Build Wear OS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APKs (watch + phone)
        run: gradle :app:assembleDebug :phone:assembleDebug --stacktrace

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: badminton-tracker-watch-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: badminton-tracker-phone-apk
          path: phone/build/outputs/apk/debug/phone-debug.apk
