name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # The project may sit at the repo root or inside a subfolder
      # (e.g. badminton-tracker-wearos/). Find settings.gradle.kts either way.
      - name: Locate Gradle project
        id: proj
        run: |
          SETTINGS="$(find . -maxdepth 2 -name settings.gradle.kts | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found" >&2
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # FIX: the action's default is "tools platform-tools". Google has
          # removed the legacy "tools" package from the SDK repository, so
          # sdkmanager fails with "Failed to find package 'tools'" (exit 1).
          # Requesting only platform-tools avoids it. The action still sets
          # ANDROID_HOME and accepts SDK licenses, so AGP can download the
          # platform / build-tools it needs on its own.
          packages: 'platform-tools'

      # The project has no Gradle wrapper (gradlew), so use a pinned Gradle.
      # AGP 8.5.2 needs Gradle >= 8.7; Kotlin 2.1.20 supports up to 8.11.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APKs (watch + phone)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :app:assembleDebug :phone:assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: ${{ steps.proj.outputs.dir }}/*/build/outputs/apk/debug/*.apk
          if-no-files-found: error
